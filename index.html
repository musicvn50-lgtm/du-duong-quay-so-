<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DU DƯƠNG - Quay số</title>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f6efdc;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 92%;
      max-width: 500px;
      padding: 45px 30px;
      background: #fffdf8;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(60,40,20,.15);
    }

    .title {
      font-size: 42px;
      font-weight: 900;
      color: #2e241d;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 17px;
      font-weight: bold;
      color: #98583d;
    }

    .number {
      height: 130px;
      margin: 45px 0 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 100px;
      font-weight: 900;
      color: #4b2d20;
    }

    .rolling {
      animation: rolling .08s infinite alternate;
    }

    @keyframes rolling {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.08);
      }
    }

    button {
      border: none;
      padding: 17px 45px;
      border-radius: 50px;
      background: #837c75;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.03);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      min-height: 25px;
      margin-top: 20px;
      color: #8b6b57;
      font-size: 15px;
    }

    .barcode {
      margin-top: 25px;
      min-height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .note {
      margin-top: 20px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="title">
    DU DƯƠNG
  </div>

  <div class="subtitle">
    SỐ MAY MẮN 1 – 100
  </div>

  <div id="number" class="number">
    ?
  </div>

  <button id="button" onclick="quaySo()">
    QUAY SỐ
  </button>

  <div id="status" class="status">
    Bạn chưa quay số
  </div>

  <div class="barcode">
    <svg id="barcode"></svg>
  </div>

  <div class="note">
    Mỗi thiết bị chỉ được quay một lần
  </div>

</div>


<script>

// ========================================
// URL GOOGLE APPS SCRIPT CỦA BẠN
// ========================================

const API_URL =
"https://script.google.com/macros/s/AKfycbwivg3ZSnvvijAAVD4_zjEKHmHE6p9x3jBPX9770SKtG7VfztQs2OXYF-FfEexkXXQ3/exec";


// ========================================
// TÊN LƯU TRỮ
// ========================================

const STORAGE_KEY =
"DU_DUONG_SO_MAY_NAY";

const DEVICE_KEY =
"DU_DUONG_DEVICE_ID";


// ========================================
// TẠO ID RIÊNG CHO THIẾT BỊ
// ========================================

function getDeviceId() {

  let id =
    localStorage.getItem(DEVICE_KEY);

  if (!id) {

    id =
      "device_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 12);

    localStorage.setItem(
      DEVICE_KEY,
      id
    );
  }

  return id;
}


// ========================================
// KIỂM TRA ĐÃ QUAY CHƯA
// ========================================

function kiemTraSoCu() {

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  if (saved) {

    hienThiSoCu(saved);

  }
}


// ========================================
// HIỆN SỐ CŨ
// ========================================

function hienThiSoCu(number) {

  document.getElementById(
    "number"
  ).innerText = number;

  document.getElementById(
    "status"
  ).innerText =
    "Bạn đã quay số này rồi";

  const button =
    document.getElementById(
      "button"
    );

  button.innerText =
    "ĐÃ QUAY";

  button.disabled =
    true;

  taoBarcode(number);
}


// ========================================
// QUAY SỐ
// ========================================

function quaySo() {

  // Nếu máy này đã quay
  const oldNumber =
    localStorage.getItem(
      STORAGE_KEY
    );

  if (oldNumber) {

    hienThiSoCu(oldNumber);

    return;
  }


  const button =
    document.getElementById(
      "button"
    );

  const numberBox =
    document.getElementById(
      "number"
    );

  const status =
    document.getElementById(
      "status"
    );


  button.disabled =
    true;

  numberBox.classList.add(
    "rolling"
  );

  status.innerText =
    "Đang quay số...";


  // Chỉ tạo hiệu ứng chạy số
  // KHÔNG phải kết quả thật

  let count = 0;

  const animation =
    setInterval(function() {

      const random =
        Math.floor(
          Math.random() * 100
        ) + 1;

      numberBox.innerText =
        random;

      count++;

      if (count >= 30) {

        clearInterval(animation);

        numberBox.classList.remove(
          "rolling"
        );

        status.innerText =
          "Đang xác nhận số...";

        layMaTuGoogle();

      }

    }, 70);
}


// ========================================
// GỌI GOOGLE APPS SCRIPT
// ========================================

function layMaTuGoogle() {

  const deviceId =
    encodeURIComponent(
      getDeviceId()
    );

  const callbackName =
    "duDuong_" +
    Date.now();

  const script =
    document.createElement(
      "script"
    );

  const timeout =
    setTimeout(function() {

      script.remove();

      delete window[callbackName];

      hienThiLoi(
        "Không kết nối được với hệ thống"
      );

    }, 15000);


  window[callbackName] =
    function(data) {

      clearTimeout(timeout);

      script.remove();

      delete window[callbackName];


      if (!data.success) {

        hienThiLoi(
          data.message ||
          "Có lỗi xảy ra"
        );

        return;
      }


      // LƯU CHÍNH MÃ GOOGLE TRẢ VỀ

      localStorage.setItem(
        STORAGE_KEY,
        data.ma
      );


      hienThiSoMoi(
        data.ma,
        data.daCo
      );

    };


  script.src =
    API_URL +
    "?clientId=" +
    deviceId +
    "&callback=" +
    callbackName;


  document.body.appendChild(
    script
  );
}


// ========================================
// HIỆN KẾT QUẢ
// ========================================

function hienThiSoMoi(
  number,
  daCo
) {

  document.getElementById(
    "number"
  ).innerText = number;


  document.getElementById(
    "status"
  ).innerText =
    daCo
      ? "Bạn đã quay số này rồi"
      : "🎉 Số may mắn của bạn là " + number;


  const button =
    document.getElementById(
      "button"
    );

  button.innerText =
    "ĐÃ QUAY";

  button.disabled =
    true;


  taoBarcode(number);
}


// ========================================
// TẠO MÃ GẠCH NGANG
// ========================================

function taoBarcode(number) {

  JsBarcode(
    "#barcode",
    String(number),
    {
      format: "CODE128",
      width: 3,
      height: 70,
      displayValue: true,
      fontSize: 18,
      margin: 5
    }
  );
}


// ========================================
// HIỆN LỖI
// ========================================

function hienThiLoi(message) {

  const numberBox =
    document.getElementById(
      "number"
    );

  const button =
    document.getElementById(
      "button"
    );

  numberBox.classList.remove(
    "rolling"
  );

  numberBox.innerText =
    "?";

  document.getElementById(
    "status"
  ).innerText =
    "⚠️ " + message;

  button.disabled =
    false;
}


// ========================================
// KHỞI ĐỘNG
// ========================================

kiemTraSoCu();

</script>

</body>
</html>
