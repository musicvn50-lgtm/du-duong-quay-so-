<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DU DƯƠNG - Quay số</title>

  <!-- Thư viện barcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f6efdc;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 92%;
      max-width: 500px;
      padding: 45px 30px;
      background: #fffdf8;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(60,40,20,.15);
    }

    .title {
      font-size: 42px;
      font-weight: 900;
      color: #2e241d;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 17px;
      font-weight: bold;
      color: #98583d;
    }

    .number {
      height: 130px;
      margin: 45px 0 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 100px;
      font-weight: 900;
      color: #4b2d20;
    }

    .rolling {
      animation: rolling .08s infinite alternate;
    }

    @keyframes rolling {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.08);
      }
    }

    button {
      border: none;
      padding: 17px 45px;
      border-radius: 50px;
      background: #837c75;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.03);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      min-height: 25px;
      margin-top: 20px;
      color: #8b6b57;
      font-size: 15px;
    }

    .barcode {
      margin-top: 25px;
      min-height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .note {
      margin-top: 20px;
      color: #aaa;
      font-size: 12px;
    }

    .error {
      color: #b33a3a;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="title">
      DU DƯƠNG
    </div>

    <div class="subtitle">
      SỐ MAY MẮN 1 – 100
    </div>

    <div id="number" class="number">
      ?
    </div>

    <button id="button" onclick="quaySo()">
      QUAY SỐ
    </button>

    <div id="status" class="status">
      Bạn chưa quay số
    </div>

    <div class="barcode">
      <svg id="barcode"></svg>
    </div>

    <div class="note">
      Mỗi thiết bị chỉ được quay một lần
    </div>

  </div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT - URL MỚI
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbwmS3InNYS0ssoCVbwlfmREMcH2Gv15PllLbVoAbZYTEvRlyzyKRsbF-Svz1kCHHHKJ/exec";


/* =====================================================
   STORAGE
   ===================================================== */

const NUMBER_KEY =
"DU_DUONG_SO_MAY_NAY";

const DEVICE_KEY =
"DU_DUONG_DEVICE_ID";


/* =====================================================
   TẠO MÃ THIẾT BỊ
   ===================================================== */

function getDeviceId() {

  let deviceId =
    localStorage.getItem(DEVICE_KEY);

  if (!deviceId) {

    deviceId =
      "device_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 12);

    localStorage.setItem(
      DEVICE_KEY,
      deviceId
    );
  }

  return deviceId;
}


/* =====================================================
   KIỂM TRA MÁY NÀY ĐÃ CÓ SỐ CHƯA
   ===================================================== */

function kiemTraSoCu() {

  const oldNumber =
    localStorage.getItem(NUMBER_KEY);

  if (oldNumber) {

    hienThiSoCu(oldNumber);

  }
}


/* =====================================================
   HIỆN SỐ ĐÃ CÓ
   ===================================================== */

function hienThiSoCu(number) {

  const numberBox =
    document.getElementById("number");

  const button =
    document.getElementById("button");

  const status =
    document.getElementById("status");

  numberBox.innerText =
    number;

  status.innerText =
    "Bạn đã quay số này rồi";

  button.innerText =
    "ĐÃ QUAY";

  button.disabled =
    true;

  taoBarcode(number);
}


/* =====================================================
   BẤM QUAY SỐ
   ===================================================== */

function quaySo() {

  // Kiểm tra localStorage trước

  const oldNumber =
    localStorage.getItem(NUMBER_KEY);

  if (oldNumber) {

    hienThiSoCu(oldNumber);

    return;

  }


  const button =
    document.getElementById("button");

  const numberBox =
    document.getElementById("number");

  const status =
    document.getElementById("status");


  button.disabled =
    true;

  numberBox.classList.add("rolling");

  status.innerText =
    "Đang quay số...";


  /*
    Phần dưới chỉ tạo hiệu ứng.
    SỐ THẬT sẽ lấy từ Google Sheet.
  */

  let count = 0;

  const animation =
    setInterval(function() {

      const fakeNumber =
        Math.floor(
          Math.random() * 100
        ) + 1;

      numberBox.innerText =
        String(fakeNumber)
          .padStart(3, "0");

      count++;


      if (count >= 30) {

        clearInterval(animation);

        numberBox.classList.remove(
          "rolling"
        );

        status.innerText =
          "Đang xác nhận số...";

        layMaTuGoogle();

      }

    }, 70);

}


/* =====================================================
   GỌI GOOGLE APPS SCRIPT
   ===================================================== */

function layMaTuGoogle() {

  const deviceId =
    encodeURIComponent(
      getDeviceId()
    );


  /*
    Dùng JSONP để tránh lỗi CORS
    khi chạy trên GitHub Pages.
  */

  const callbackName =
    "duDuongCallback_" +
    Date.now();


  const script =
    document.createElement("script");


  let finished = false;


  const timeout =
    setTimeout(function() {

      if (finished) return;

      finished = true;

      script.remove();

      delete window[callbackName];

      hienThiLoi(
        "Không thể kết nối với hệ thống"
      );

    }, 20000);


  window[callbackName] =
    function(data) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      script.remove();

      delete window[callbackName];


      console.log(
        "Google trả về:",
        data
      );


      if (!data || !data.success) {

        hienThiLoi(
          data && data.message
            ? data.message
            : "Không nhận được mã"
        );

        return;
      }


      /*
        Đây là số thật lấy từ Google Sheet.
      */

      const number =
        String(data.ma)
          .padStart(3, "0");


      /*
        Lưu vào máy.
      */

      localStorage.setItem(
        NUMBER_KEY,
        number
      );


      /*
        Hiện kết quả.
      */

      hienThiSoMoi(
        number,
        data.daCo
      );

    };


  /*
    Gọi Apps Script
  */

  script.src =
    API_URL +
    "?clientId=" +
    deviceId +
    "&callback=" +
    callbackName;


  document.body.appendChild(script);

}


/* =====================================================
   HIỆN SỐ MỚI
   ===================================================== */

function hienThiSoMoi(
  number,
  daCo
) {

  const numberBox =
    document.getElementById("number");

  const button =
    document.getElementById("button");

  const status =
    document.getElementById("status");


  numberBox.innerText =
    number;


  if (daCo) {

    status.innerText =
      "Bạn đã quay số này rồi";

  } else {

    status.innerText =
      "🎉 Số may mắn của bạn là " +
      number;

  }


  button.innerText =
    "ĐÃ QUAY";

  button.disabled =
    true;


  taoBarcode(number);

}


/* =====================================================
   TẠO BARCODE
   ===================================================== */

function taoBarcode(number) {

  try {

    JsBarcode(
      "#barcode",
      String(number),
      {
        format: "CODE128",
        width: 3,
        height: 70,
        displayValue: true,
        fontSize: 18,
        margin: 5
      }
    );

  } catch (error) {

    console.error(
      "Barcode error:",
      error
    );

  }

}


/* =====================================================
   HIỆN LỖI
   ===================================================== */

function hienThiLoi(message) {

  const numberBox =
    document.getElementById("number");

  const button =
    document.getElementById("button");

  const status =
    document.getElementById("status");


  numberBox.classList.remove(
    "rolling"
  );

  numberBox.innerText =
    "?";

  status.innerText =
    "⚠️ " + message;

  status.classList.add("error");

  button.disabled =
    false;

}


/* =====================================================
   CHẠY KHI MỞ TRANG
   ===================================================== */

kiemTraSoCu();

</script>

</body>
</html>
