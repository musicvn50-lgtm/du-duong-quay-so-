<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DU DƯƠNG - Quay số</title>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #f6efdc;

      font-family: Arial, sans-serif;
    }

    .card {
      width: 92%;
      max-width: 500px;

      padding: 45px 30px;

      background: #fffdf8;

      border-radius: 28px;

      text-align: center;

      box-shadow:
        0 15px 45px rgba(60,40,20,.15);
    }

    .title {
      font-size: 42px;
      font-weight: 900;

      color: #2e241d;

      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 17px;
      font-weight: bold;

      color: #98583d;
    }

    .number {
      height: 130px;

      margin: 45px 0 30px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 100px;
      font-weight: 900;

      color: #4b2d20;
    }

    .rolling {
      animation: rolling .08s infinite alternate;
    }

    @keyframes rolling {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.08);
      }
    }

    button {
      border: none;

      padding: 17px 45px;

      border-radius: 50px;

      background: #837c75;

      color: white;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      transform: scale(1.03);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      min-height: 25px;

      margin-top: 20px;

      color: #8b6b57;

      font-size: 15px;
    }

    .barcode {
      margin-top: 25px;

      min-height: 90px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .note {
      margin-top: 20px;

      color: #aaa;

      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="title">
    DU DƯƠNG
  </div>

  <div class="subtitle">
    SỐ MAY MẮN 1 – 100
  </div>

  <div id="number" class="number">
    ?
  </div>

  <button id="button" onclick="quaySo()">
    QUAY SỐ
  </button>

  <div id="status" class="status">
    Bạn chưa quay số
  </div>

  <div class="barcode">
    <svg id="barcode"></svg>
  </div>

  <div class="note">
    Mỗi thiết bị chỉ được quay một lần
  </div>

</div>


<script>

/* =====================================
   LINK GOOGLE APPS SCRIPT
===================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzxD2A5Z3vepraTcmTSFnLHGDg4fREwPM5_kpQygYJfMmQFjSL_DS-AE92vhGI9HfOW/exec";


/* =====================================
   TẠO MÃ THIẾT BỊ
===================================== */

const DEVICE_KEY = "DU_DUONG_DEVICE_ID";

function getDeviceId() {

  let id = localStorage.getItem(DEVICE_KEY);

  if (!id) {

    id =
      "DD-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 10);

    localStorage.setItem(
      DEVICE_KEY,
      id
    );
  }

  return id;
}


/* =====================================
   LƯU SỐ Ở MÁY
===================================== */

const NUMBER_KEY =
"DU_DUONG_SO_MAY_NAY";


/* =====================================
   KIỂM TRA SỐ CŨ
===================================== */

function kiemTraSoCu() {

  const saved =
    localStorage.getItem(NUMBER_KEY);

  if (saved) {

    hienThiSoCu(
      Number(saved)
    );

    return true;
  }

  return false;
}


/* =====================================
   HIỂN THỊ SỐ CŨ
===================================== */

function hienThiSoCu(number) {

  const numberBox =
    document.getElementById("number");

  const button =
    document.getElementById("button");

  const status =
    document.getElementById("status");

  numberBox.innerText =
    String(number).padStart(3, "0");

  status.innerText =
    "Bạn đã quay số này rồi";

  button.innerText =
    "ĐÃ QUAY";

  button.disabled =
    true;

  taoBarcode(number);
}


/* =====================================
   QUAY SỐ
===================================== */

function quaySo() {

  const oldNumber =
    localStorage.getItem(NUMBER_KEY);

  if (oldNumber) {

    hienThiSoCu(
      Number(oldNumber)
    );

    return;
  }


  const button =
    document.getElementById("button");

  const numberBox =
    document.getElementById("number");

  const status =
    document.getElementById("status");


  button.disabled = true;

  numberBox.classList.add(
    "rolling"
  );

  status.innerText =
    "Đang quay số...";


  let count = 0;


  const animation =
    setInterval(function() {

      const random =
        Math.floor(
          Math.random() * 100
        ) + 1;

      numberBox.innerText =
        String(random).padStart(3, "0");


      count++;


      if (count >= 30) {

        clearInterval(animation);

        numberBox.classList.remove(
          "rolling"
        );

        goiAPI();

      }

    }, 70);
}


/* =====================================
   GỌI GOOGLE APPS SCRIPT
===================================== */

function goiAPI() {

  const deviceId =
    getDeviceId();


  const callbackName =
    "duDuongCallback_" +
    Date.now();


  window[callbackName] =
    function(data) {

      try {

        if (
          data &&
          data.success
        ) {

          const number =
            Number(data.ma);


          // Lưu số vào máy
          localStorage.setItem(
            NUMBER_KEY,
            number
          );


          hienThiSoMoi(
            number
          );

        }
        else {

          hienThiLoi(
            data &&
            data.message
              ? data.message
              : "Không thể kết nối với hệ thống"
          );

        }

      }
      finally {

        delete window[callbackName];

        if (script) {
          script.remove();
        }

      }

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?clientId=" +
    encodeURIComponent(deviceId) +
    "&callback=" +
    encodeURIComponent(callbackName);


  script.onerror =
    function() {

      delete window[callbackName];

      script.remove();

      hienThiLoi(
        "Không thể kết nối với hệ thống"
      );

    };


  document.body.appendChild(
    script
  );
}


/* =====================================
   HIỂN THỊ SỐ MỚI
===================================== */

function hienThiSoMoi(number) {

  const numberBox =
    document.getElementById("number");

  const button =
    document.getElementById("button");

  const status =
    document.getElementById("status");


  numberBox.innerText =
    String(number).padStart(3, "0");


  status.innerText =
    "🎉 Số may mắn của bạn là " +
    String(number).padStart(3, "0");


  button.innerText =
    "ĐÃ QUAY";


  button.disabled =
    true;


  taoBarcode(number);
}


/* =====================================
   HIỂN THỊ LỖI
===================================== */

function hienThiLoi(message) {

  const button =
    document.getElementById("button");

  const status =
    document.getElementById("status");


  button.disabled =
    false;


  status.innerText =
    "⚠️ " + message;
}


/* =====================================
   TẠO BARCODE
===================================== */

function taoBarcode(number) {

  JsBarcode(
    "#barcode",

    String(number).padStart(3, "0"),

    {
      format: "CODE128",

      width: 3,

      height: 70,

      displayValue: true,

      fontSize: 18,

      margin: 5
    }
  );
}


/* =====================================
   KHI MỞ TRANG
===================================== */

kiemTraSoCu();

</script>

</body>
</html>
