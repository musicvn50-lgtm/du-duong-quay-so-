<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DU DƯƠNG - Quay số</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  background:#f6efdc;

  font-family:Arial,sans-serif;
}

.card{
  width:92%;
  max-width:500px;

  padding:45px 30px;

  background:#fffdf8;

  border-radius:28px;

  text-align:center;

  box-shadow:0 15px 45px rgba(60,40,20,.15);
}

.title{
  font-size:42px;
  font-weight:900;

  color:#2e241d;

  margin-bottom:8px;
}

.subtitle{
  font-size:17px;
  font-weight:bold;

  color:#98583d;
}

.number{
  height:130px;

  margin:45px 0 30px;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:100px;
  font-weight:900;

  color:#4b2d20;
}

.rolling{
  animation:rolling .08s infinite alternate;
}

@keyframes rolling{

  from{
    transform:scale(1);
  }

  to{
    transform:scale(1.08);
  }

}

button{

  border:none;

  padding:17px 45px;

  border-radius:50px;

  background:#837c75;

  color:white;

  font-size:20px;

  font-weight:bold;

  cursor:pointer;

}

button:hover{
  transform:scale(1.03);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{

  min-height:25px;

  margin-top:20px;

  color:#8b6b57;

  font-size:15px;

}

.barcode{

  margin-top:25px;

  min-height:90px;

  display:flex;

  justify-content:center;

  align-items:center;

}

.note{

  margin-top:20px;

  color:#aaa;

  font-size:12px;

}

.error{
  color:#b33a3a;
}

</style>
</head>


<body>

<div class="card">

  <div class="title">
    DU DƯƠNG
  </div>

  <div class="subtitle">
    SỐ MAY MẮN 1 – 100
  </div>


  <div id="number" class="number">
    ?
  </div>


  <button id="button" onclick="quaySo()">
    QUAY SỐ
  </button>


  <div id="status" class="status">
    Bạn chưa quay số
  </div>


  <div class="barcode">
    <svg id="barcode"></svg>
  </div>


  <div class="note">
    Mỗi thiết bị chỉ được quay một lần
  </div>

</div>


<script>

/* =========================================
   API GOOGLE APPS SCRIPT DU DƯƠNG
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzxRhqRe1hXw6g159LdhTaI0MgS-cEMvs5-TVyWJ050f-r8ZGLRF13sva_rGkD6zSFT/exec";


/* =========================================
   MÃ THIẾT BỊ
========================================= */

const DEVICE_KEY =
"DU_DUONG_DEVICE_ID";


function getDeviceId(){

  let id =
    localStorage.getItem(DEVICE_KEY);

  if(!id){

    id =
      "DD-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,10);

    localStorage.setItem(
      DEVICE_KEY,
      id
    );

  }

  return id;

}


/* =========================================
   BARCODE
========================================= */

function taoBarcode(ma){

  JsBarcode(
    "#barcode",
    String(ma),
    {
      format:"CODE128",
      width:3,
      height:70,
      displayValue:true,
      fontSize:18,
      margin:5
    }
  );

}


/* =========================================
   HIỂN THỊ SỐ
========================================= */

function hienThiSo(ma,daCo){

  const number =
    document.getElementById("number");

  const button =
    document.getElementById("button");

  const status =
    document.getElementById("status");


  ma =
    String(ma).padStart(3,"0");


  number.innerText =
    ma;


  button.innerText =
    "ĐÃ QUAY";


  button.disabled =
    true;


  if(daCo){

    status.innerText =
      "Bạn đã quay số này rồi";

  }else{

    status.innerText =
      "🎉 Số may mắn của bạn là " + ma;

  }


  taoBarcode(ma);

}


/* =========================================
   GỌI GOOGLE APPS SCRIPT
========================================= */

function goiAPI(){

  return new Promise(function(resolve,reject){

    const callbackName =
      "duDuong_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random()*100000
      );


    const script =
      document.createElement("script");


    const timeout =
      setTimeout(function(){

        cleanup();

        reject(
          new Error(
            "Không kết nối được với hệ thống"
          )
        );

      },15000);


    function cleanup(){

      clearTimeout(timeout);

      delete window[callbackName];

      if(script.parentNode){

        script.parentNode.removeChild(script);

      }

    }


    window[callbackName] =
      function(data){

        cleanup();

        resolve(data);

      };


    script.onerror =
      function(){

        cleanup();

        reject(
          new Error(
            "Không kết nối được với hệ thống"
          )
        );

      };


    const deviceId =
      encodeURIComponent(
        getDeviceId()
      );


    script.src =
      API_URL +
      "?clientId=" +
      deviceId +
      "&callback=" +
      callbackName;


    document.body.appendChild(script);

  });

}


/* =========================================
   QUAY SỐ
========================================= */

async function quaySo(){

  const button =
    document.getElementById("button");

  const number =
    document.getElementById("number");

  const status =
    document.getElementById("status");


  button.disabled =
    true;


  number.classList.add(
    "rolling"
  );


  status.classList.remove(
    "error"
  );


  status.innerText =
    "Đang quay số...";


  let count = 0;


  const animation =
    setInterval(function(){

      const random =
        Math.floor(
          Math.random()*100
        )+1;


      number.innerText =
        String(random)
        .padStart(3,"0");


      count++;

    },70);


  try{

    const data =
      await goiAPI();


    clearInterval(animation);


    number.classList.remove(
      "rolling"
    );


    if(
      !data ||
      data.success !== true
    ){

      throw new Error(
        data && data.message
          ? data.message
          : "Không nhận được mã"
      );

    }


    const ma =
      String(data.ma)
      .padStart(3,"0");


    hienThiSo(
      ma,
      data.daCo === true
    );


  }catch(error){

    clearInterval(animation);


    number.classList.remove(
      "rolling"
    );


    button.disabled =
      false;


    status.classList.add(
      "error"
    );


    status.innerText =
      "❌ " + error.message;


    console.error(error);

  }

}

</script>

</body>
</html>
