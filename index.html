<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DU DƯƠNG - Quay số</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  background: #f6efdc;

  font-family: Arial, sans-serif;
}

.card {
  width: 92%;
  max-width: 500px;

  padding: 45px 30px;

  background: #fffdf8;

  border-radius: 28px;

  text-align: center;

  box-shadow: 0 15px 45px rgba(60,40,20,.15);
}

.title {
  font-size: 42px;
  font-weight: 900;

  color: #2e241d;

  margin-bottom: 8px;
}

.subtitle {
  font-size: 17px;
  font-weight: bold;

  color: #98583d;
}

.number {
  height: 130px;

  margin: 45px 0 30px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 100px;
  font-weight: 900;

  color: #4b2d20;

  user-select: none;
}

.rolling {
  animation: rolling 0.08s infinite alternate;
}

@keyframes rolling {

  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.06);
  }

}

.winner {
  animation: winner 0.5s ease;
}

@keyframes winner {

  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.15);
  }

  100% {
    transform: scale(1);
  }

}

button {

  border: none;

  padding: 17px 45px;

  border-radius: 50px;

  background: #837c75;

  color: white;

  font-size: 20px;

  font-weight: bold;

  cursor: pointer;

  transition: .2s;

}

button:hover:not(:disabled) {
  transform: scale(1.03);
}

button:disabled {

  opacity: .6;

  cursor: not-allowed;

}

.status {

  min-height: 25px;

  margin-top: 20px;

  color: #8b6b57;

  font-size: 15px;

}

.error {
  color: #b52f2f;
}

.barcode {

  margin-top: 25px;

  min-height: 90px;

  display: flex;

  justify-content: center;

  align-items: center;

}

.note {

  margin-top: 20px;

  color: #aaa;

  font-size: 12px;

}
</style>

</head>

<body>

<div class="card">

  <div class="title">
    DU DƯƠNG
  </div>

  <div class="subtitle">
    SỐ MAY MẮN 1 – 100
  </div>

  <div
    id="number"
    class="number"
  >
    ?
  </div>

  <button
    id="button"
    onclick="quaySo()"
  >
    QUAY SỐ
  </button>

  <div
    id="status"
    class="status"
  >
    Bạn chưa quay số
  </div>

  <div class="barcode">

    <svg id="barcode"></svg>

  </div>

  <div class="note">
    Mỗi thiết bị chỉ được quay một lần
  </div>

</div>


<script>

/* =====================================================
   API DU DƯƠNG
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbw782VWS2H9I8xMVl8gsdt1n_L6WS__mek84UkMCaKTCidXKLniZX4hkuxsJNG0aqI4/exec";


/* =====================================================
   TẠO ID THIẾT BỊ
   ===================================================== */

function getDeviceId() {

  let id =
    localStorage.getItem(
      "DU_DUONG_DEVICE_ID"
    );

  if (!id) {

    if (
      window.crypto &&
      crypto.randomUUID
    ) {

      id = crypto.randomUUID();

    } else {

      id =
        "DD-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2);

    }

    localStorage.setItem(
      "DU_DUONG_DEVICE_ID",
      id
    );
  }

  return id;
}


/* =====================================================
   LẤY ELEMENT
   ===================================================== */

const numberBox =
  document.getElementById("number");

const button =
  document.getElementById("button");

const status =
  document.getElementById("status");


let dangQuay = false;


/* =====================================================
   LẤY SỐ TỪ SERVER
   ===================================================== */

async function laySo() {

  const deviceId =
    getDeviceId();

  const url =
    API_URL +
    "?clientId=" +
    encodeURIComponent(deviceId) +
    "&t=" +
    Date.now();

  const response =
    await fetch(
      url,
      {
        method: "GET",
        cache: "no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      "HTTP " + response.status
    );

  }

  const data =
    await response.json();

  if (!data.success) {

    throw new Error(
      data.message ||
      "Không thể nhận số"
    );

  }

  return data;
}


/* =====================================================
   HIỆU ỨNG SỐ CHẠY
   ===================================================== */

function chaySo() {

  let random =
    Math.floor(
      Math.random() * 100
    ) + 1;

  numberBox.innerText =
    random;

}


/* =====================================================
   QUAY SỐ
   ===================================================== */

async function quaySo() {

  if (dangQuay) {
    return;
  }

  dangQuay = true;

  button.disabled = true;

  numberBox.classList.remove(
    "winner"
  );

  numberBox.classList.add(
    "rolling"
  );

  status.classList.remove(
    "error"
  );

  status.innerText =
    "Đang quay số...";


  /*
   * GỌI SERVER NGAY
   */
  const request =
    laySo();


  /*
   * CHẠY HIỆU ỨNG
   */
  const animation =
    setInterval(
      chaySo,
      70
    );


  try {

    /*
     * ĐỢI SERVER
     */
    const data =
      await request;


    /*
     * ĐẢM BẢO HIỆU ỨNG
     * CHẠY ÍT NHẤT 1.2 GIÂY
     */
    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          1200
        )
    );


    /*
     * DỪNG SỐ CHẠY
     */
    clearInterval(
      animation
    );


    numberBox.classList.remove(
      "rolling"
    );


    /*
     * SỐ THẬT SERVER TRẢ VỀ
     */
    const so =
      Number(data.so);


    numberBox.innerText =
      so;


    /*
     * LƯU SỐ TRÊN THIẾT BỊ
     */
    localStorage.setItem(
      "DU_DUONG_MY_NUMBER",
      String(so)
    );


    /*
     * HIỆU ỨNG TRÚNG SỐ
     */
    numberBox.classList.add(
      "winner"
    );


    status.innerText =
      "🎉 Số may mắn của bạn là " +
      so;


    button.innerText =
      "ĐÃ QUAY";


    button.disabled =
      true;


    /*
     * TẠO BARCODE
     */
    taoBarcode(
      so
    );


  } catch (error) {

    clearInterval(
      animation
    );

    numberBox.classList.remove(
      "rolling"
    );

    numberBox.innerText =
      "?";


    status.classList.add(
      "error"
    );

    status.innerText =
      error.message ||
      "Không thể kết nối với hệ thống";


    button.disabled =
      false;

    dangQuay =
      false;


    console.error(
      error
    );

  }

}


/* =====================================================
   HIỂN THỊ LẠI SỐ KHI RELOAD
   ===================================================== */

function kiemTraSoDaLuu() {

  const savedNumber =
    localStorage.getItem(
      "DU_DUONG_MY_NUMBER"
    );


  /*
   * NẾU THIẾT BỊ NÀY ĐÃ QUAY
   */
  if (savedNumber) {

    const so =
      Number(savedNumber);


    if (
      so >= 1 &&
      so <= 100
    ) {

      numberBox.innerText =
        so;


      status.innerText =
        "Bạn đã quay số này rồi";


      button.innerText =
        "ĐÃ QUAY";


      button.disabled =
        true;


      taoBarcode(
        so
      );

    }

  }

}


/* =====================================================
   BARCODE
   ===================================================== */

function taoBarcode(
  so
) {

  try {

    JsBarcode(
      "#barcode",
      String(so),
      {

        format: "CODE128",

        width: 3,

        height: 70,

        displayValue: true,

        fontSize: 18,

        margin: 5

      }
    );

  } catch (error) {

    console.error(
      "Barcode error:",
      error
    );

  }

}


/* =====================================================
   KHI MỞ TRANG
   ===================================================== */

/*
 * QUAN TRỌNG:
 *
 * KHÔNG gọi API ở đây.
 *
 * Chỉ đọc localStorage.
 *
 * Vì nếu gọi API khi reload,
 * server sẽ tưởng người đó đang quay
 * và có thể cấp thêm số.
 */

kiemTraSoDaLuu();

</script>

</body>
</html>
