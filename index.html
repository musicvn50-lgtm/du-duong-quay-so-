<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DU DƯƠNG - Quay số</title>

  <!-- BARCODE -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #f6efdc;

      font-family: Arial, sans-serif;
    }

    .card {
      width: 92%;
      max-width: 500px;

      padding: 45px 30px;

      background: #fffdf8;

      border-radius: 28px;

      text-align: center;

      box-shadow:
        0 15px 45px rgba(60,40,20,.15);
    }

    .title {
      font-size: 42px;
      font-weight: 900;

      color: #2e241d;

      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 17px;
      font-weight: bold;

      color: #98583d;
    }

    .number {
      height: 130px;

      margin: 45px 0 30px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 100px;
      font-weight: 900;

      color: #4b2d20;
    }

    .rolling {
      animation: rolling .08s infinite alternate;
    }

    @keyframes rolling {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.08);
      }
    }

    button {
      border: none;

      padding: 17px 45px;

      border-radius: 50px;

      background: #837c75;

      color: white;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;

      transition: .2s;
    }

    button:hover {
      transform: scale(1.03);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      min-height: 25px;

      margin-top: 20px;

      color: #8b6b57;

      font-size: 15px;
    }

    .barcode {
      margin-top: 25px;

      min-height: 90px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .note {
      margin-top: 20px;

      color: #aaa;

      font-size: 12px;
    }

    .error {
      color: #b33a2b;
    }
  </style>
</head>


<body>

  <div class="card">

    <div class="title">
      DU DƯƠNG
    </div>

    <div class="subtitle">
      SỐ MAY MẮN 1 – 100
    </div>


    <div id="number" class="number">
      ?
    </div>


    <button
      id="button"
      onclick="quaySo()">

      QUAY SỐ

    </button>


    <div id="status" class="status">
      Bạn chưa quay số
    </div>


    <div class="barcode">
      <svg id="barcode"></svg>
    </div>


    <div class="note">
      Mỗi thiết bị chỉ được quay một lần
    </div>

  </div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbz6XT6mNl-U_pIYrH1FSVn9OBq3VwvyCLYhftAFPHFx3G0pE2iGH_VfTMLcw8oOpwvw/exec";


/* =====================================================
   TÊN LƯU TRỮ
   ===================================================== */

const NUMBER_KEY =
"DU_DUONG_NUMBER";

const CLIENT_KEY =
"DU_DUONG_CLIENT_ID";


/* =====================================================
   TẠO MÃ THIẾT BỊ
   ===================================================== */

function getClientId() {

  let clientId =
    localStorage.getItem(CLIENT_KEY);


  if (!clientId) {

    clientId =
      "DD-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 12);

    localStorage.setItem(
      CLIENT_KEY,
      clientId
    );

  }


  return clientId;
}


/* =====================================================
   CALLBACK JSONP
   ===================================================== */

function xuLyKetQua(data) {

  const button =
    document.getElementById("button");

  const numberBox =
    document.getElementById("number");

  const status =
    document.getElementById("status");


  /* ================================================
     HỆ THỐNG TRẢ LỖI
     ================================================ */

  if (!data || data.success !== true) {

    numberBox.classList.remove("rolling");

    button.disabled = false;

    status.classList.add("error");

    status.innerText =
      data && data.message
        ? data.message
        : "Không thể kết nối với hệ thống";

    return;
  }


  /* ================================================
     NHẬN SỐ
     ================================================ */

  const ma =
    String(data.ma).padStart(3, "0");


  /* ================================================
     LƯU LOCAL
     ================================================ */

  localStorage.setItem(
    NUMBER_KEY,
    ma
  );


  /* ================================================
     DỪNG QUAY
     ================================================ */

  numberBox.classList.remove("rolling");

  numberBox.innerText =
    ma;


  /* ================================================
     HIỂN THỊ TRẠNG THÁI
     ================================================ */

  if (data.daCo) {

    status.innerText =
      "Bạn đã quay số này rồi";

  } else {

    status.innerText =
      "🎉 Số may mắn của bạn là " + ma;

  }


  /* ================================================
     KHÓA NÚT
     ================================================ */

  button.innerText =
    "ĐÃ QUAY";

  button.disabled =
    true;


  /* ================================================
     BARCODE
     ================================================ */

  taoBarcode(ma);
}


/* =====================================================
   GỌI GOOGLE APPS SCRIPT BẰNG JSONP
   ===================================================== */

function goiAPI() {

  const clientId =
    getClientId();


  const callbackName =
    "duDuongCallback_" +
    Date.now();


  window[callbackName] =
    xuLyKetQua;


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?clientId=" +
    encodeURIComponent(clientId) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      const button =
        document.getElementById("button");

      const numberBox =
        document.getElementById("number");

      const status =
        document.getElementById("status");


      numberBox.classList.remove("rolling");

      button.disabled = false;

      status.classList.add("error");

      status.innerText =
        "Không thể kết nối với hệ thống";

      delete window[callbackName];

      script.remove();

    };


  document.body.appendChild(script);


  /* ================================================
     DỌN SCRIPT SAU KHI CHẠY
     ================================================ */

  setTimeout(function() {

    delete window[callbackName];

    if (script.parentNode) {
      script.remove();
    }

  }, 15000);
}


/* =====================================================
   QUAY SỐ
   ===================================================== */

function quaySo() {

  const oldNumber =
    localStorage.getItem(NUMBER_KEY);


  /* ================================================
     NẾU MÁY NÀY ĐÃ QUAY
     ================================================ */

  if (oldNumber) {

    hienThiSoCu(oldNumber);

    return;
  }


  const button =
    document.getElementById("button");

  const numberBox =
    document.getElementById("number");

  const status =
    document.getElementById("status");


  /* ================================================
     KHÓA NÚT
     ================================================ */

  button.disabled = true;

  numberBox.classList.add("rolling");

  status.classList.remove("error");

  status.innerText =
    "Đang quay số...";


  /* ================================================
     HIỆU ỨNG SỐ CHẠY
     ================================================ */

  let count = 0;


  const animation =
    setInterval(function() {

      const random =
        Math.floor(
          Math.random() * 100
        ) + 1;


      numberBox.innerText =
        String(random).padStart(3, "0");


      count++;


      if (count >= 30) {

        clearInterval(animation);

        numberBox.classList.remove(
          "rolling"
        );


        /* ==========================================
           GỌI GOOGLE SHEET
           ========================================== */

        goiAPI();

      }

    }, 70);
}


/* =====================================================
   HIỂN THỊ SỐ CŨ
   ===================================================== */

function hienThiSoCu(ma) {

  const numberBox =
    document.getElementById("number");

  const button =
    document.getElementById("button");

  const status =
    document.getElementById("status");


  numberBox.innerText =
    String(ma).padStart(3, "0");


  button.innerText =
    "ĐÃ QUAY";


  button.disabled =
    true;


  status.innerText =
    "Bạn đã quay số này rồi";


  taoBarcode(ma);
}


/* =====================================================
   TẠO BARCODE
   ===================================================== */

function taoBarcode(ma) {

  JsBarcode(
    "#barcode",
    String(ma),
    {
      format: "CODE128",

      width: 3,

      height: 70,

      displayValue: true,

      fontSize: 18,

      margin: 5
    }
  );
}


/* =====================================================
   KIỂM TRA KHI MỞ TRANG
   ===================================================== */

function kiemTraSoCu() {

  const savedNumber =
    localStorage.getItem(NUMBER_KEY);


  if (savedNumber) {

    hienThiSoCu(
      savedNumber
    );

  }
}


/* =====================================================
   CHẠY
   ===================================================== */

kiemTraSoCu();

</script>

</body>
</html>
