<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DU DƯƠNG - Quay số</title>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f6efdc;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 92%;
      max-width: 500px;
      padding: 45px 30px;
      background: #fffdf8;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(60,40,20,.15);
    }

    .title {
      font-size: 42px;
      font-weight: 900;
      color: #2e241d;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 17px;
      font-weight: bold;
      color: #98583d;
    }

    .number {
      height: 130px;
      margin: 45px 0 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 100px;
      font-weight: 900;
      color: #4b2d20;
      transform: scale(1);
    }

    .rolling {
      animation: rolling .16s ease-in-out infinite alternate;
    }

    @keyframes rolling {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.04);
      }
    }

    .winner {
      animation: winner .3s ease-out;
    }

    @keyframes winner {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }

      100% {
        transform: scale(1);
      }
    }

    button {
      border: none;
      padding: 17px 45px;
      border-radius: 50px;
      background: #837c75;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover:not(:disabled) {
      transform: scale(1.03);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .status {
      min-height: 25px;
      margin-top: 20px;
      color: #8b6b57;
      font-size: 15px;
    }

    .error {
      color: #b33a3a;
    }

    .barcode {
      margin-top: 25px;
      min-height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .note {
      margin-top: 20px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="title">
      DU DƯƠNG
    </div>

    <div class="subtitle">
      SỐ MAY MẮN 1 – 100
    </div>

    <div id="number" class="number">
      ?
    </div>

    <button id="button" onclick="quaySo()">
      QUAY SỐ
    </button>

    <div id="status" class="status">
      Bạn chưa quay số
    </div>

    <div class="barcode">
      <svg id="barcode"></svg>
    </div>

    <div class="note">
      Mỗi lượt chỉ được quay một lần
    </div>

  </div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycby3U-Cyvo14JAVp8GM_iotSySV5JUT5H8Tc3WzyK9Ud-IizoMTV8RULH2RMjRPebRtV/exec";


let dangQuay = false;
let soThat = null;
let loiAPI = null;


/* =====================================================
   ELEMENT
   ===================================================== */

const numberBox =
document.getElementById("number");

const button =
document.getElementById("button");

const status =
document.getElementById("status");


/* =====================================================
   QUAY SỐ
   ===================================================== */

function quaySo() {

  if (dangQuay) return;

  dangQuay = true;

  soThat = null;

  loiAPI = null;

  button.disabled = true;

  numberBox.classList.remove("winner");

  numberBox.classList.add("rolling");

  status.classList.remove("error");

  status.innerText =
    "Đang quay số...";


  /*
   * GỌI GOOGLE NGAY LẬP TỨC
   * KHÔNG CHỜ HIỆU ỨNG
   */

  laySo();


  /*
   * BẮT ĐẦU HIỆU ỨNG NGAY
   */

  chayHieuUng();

}


/* =====================================================
   GỌI API
   ===================================================== */

function laySo() {

  fetch(
    API_URL + "?t=" + Date.now(),
    {
      method: "GET",
      cache: "no-store"
    }
  )

  .then(function(response) {

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    return response.json();

  })

  .then(function(data) {

    console.log("DU DUONG:", data);

    if (
      data &&
      data.success === true &&
      data.so
    ) {

      /*
       * KHÔNG THÊM SỐ 0 PHÍA TRƯỚC
       */

      soThat =
        String(Number(data.so));

      return;
    }


    throw new Error(
      data && data.message
        ? data.message
        : "Không nhận được số"
    );

  })

  .catch(function(error) {

    console.error(error);

    loiAPI = error;

  });

}


/* =====================================================
   HIỆU ỨNG QUAY
   ===================================================== */

function chayHieuUng() {

  let lastNumber = 0;

  const startTime = Date.now();

  /*
   * Ít nhất 2 giây để quay
   */

  const minimumTime = 2000;


  function frame() {

    /*
     * API LỖI
     */

    if (loiAPI) {

      numberBox.classList.remove("rolling");

      numberBox.innerText = "?";

      status.classList.add("error");

      status.innerText =
        "Không thể kết nối với hệ thống";

      button.disabled = false;

      dangQuay = false;

      return;
    }


    /*
     * API CHƯA TRẢ
     * TIẾP TỤC QUAY
     */

    if (!soThat) {

      let random;

      do {

        random =
          Math.floor(
            Math.random() * 100
          ) + 1;

      } while (
        random === lastNumber
      );


      lastNumber = random;

      numberBox.innerText =
        random;


      requestAnimationFrame(frame);

      return;
    }


    /*
     * API ĐÃ TRẢ
     * NHƯNG CHƯA ĐỦ 2 GIÂY
     */

    const elapsed =
      Date.now() - startTime;


    if (elapsed < minimumTime) {

      let random;

      do {

        random =
          Math.floor(
            Math.random() * 100
          ) + 1;

      } while (
        random === lastNumber
      );


      lastNumber = random;

      numberBox.innerText =
        random;


      requestAnimationFrame(frame);

      return;
    }


    /*
     * DỪNG TẠI SỐ THẬT
     */

    numberBox.classList.remove("rolling");

    numberBox.innerText =
      soThat;


    /*
     * Hiệu ứng thắng
     */

    numberBox.classList.add("winner");


    status.innerText =
      "🎉 Số may mắn của bạn là " + soThat;


    button.innerText =
      "ĐÃ QUAY";

    button.disabled = true;

    dangQuay = true;


    taoBarcode(soThat);

  }


  requestAnimationFrame(frame);

}


/* =====================================================
   BARCODE
   ===================================================== */

function taoBarcode(so) {

  JsBarcode(
    "#barcode",
    String(so),
    {
      format: "CODE128",
      width: 3,
      height: 70,
      displayValue: true,
      fontSize: 18,
      margin: 5
    }
  );

}

</script>

</body>
</html>
