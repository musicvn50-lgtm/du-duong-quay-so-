<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>DU DƯƠNG - Quay số</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

  background: #f6efdc;

  font-family: Arial, sans-serif;

}


.card {

  width: 92%;

  max-width: 500px;

  padding: 45px 30px;

  background: #fffdf8;

  border-radius: 28px;

  text-align: center;

  box-shadow:
    0 15px 45px rgba(60,40,20,.15);

}


.title {

  font-size: 42px;

  font-weight: 900;

  color: #2e241d;

  margin-bottom: 8px;

}


.subtitle {

  font-size: 17px;

  font-weight: bold;

  color: #98583d;

}


.number {

  height: 130px;

  margin: 45px 0 30px;

  display: flex;

  justify-content: center;

  align-items: center;

  font-size: 100px;

  font-weight: 900;

  color: #4b2d20;

}


.rolling {

  animation:
    rolling .08s infinite alternate;

}


@keyframes rolling {

  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.06);
  }

}


.winner {

  animation:
    winner .4s ease;

}


@keyframes winner {

  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.12);
  }

  100% {
    transform: scale(1);
  }

}


button {

  border: none;

  padding: 17px 45px;

  border-radius: 50px;

  background: #837c75;

  color: white;

  font-size: 20px;

  font-weight: bold;

  cursor: pointer;

}


button:hover {

  transform: scale(1.03);

}


button:disabled {

  opacity: .6;

  cursor: not-allowed;

}


.status {

  min-height: 25px;

  margin-top: 20px;

  color: #8b6b57;

  font-size: 15px;

}


.error {

  color: #b52f2f;

}


.barcode {

  margin-top: 25px;

  min-height: 90px;

  display: flex;

  justify-content: center;

  align-items: center;

}


.note {

  margin-top: 20px;

  color: #aaa;

  font-size: 12px;

}

</style>

</head>


<body>


<div class="card">


  <div class="title">

    DU DƯƠNG

  </div>


  <div class="subtitle">

    SỐ MAY MẮN 1 – 100

  </div>


  <div
    id="number"
    class="number"
  >

    ?

  </div>


  <button
    id="button"
    onclick="quaySo()"
  >

    QUAY SỐ

  </button>


  <div
    id="status"
    class="status"
  >

    Bạn chưa quay số

  </div>


  <div class="barcode">

    <svg id="barcode"></svg>

  </div>


  <div class="note">

    Mỗi thiết bị chỉ được quay một lần

  </div>


</div>



<script>


/* =====================================================
   API DU DƯƠNG
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzmsJSwysGorip4q1_AenhuCAKXAIJXeqQUORAakMyyOak8_nY2OtbIHvMk3Tx5xYXr/exec";


/* =====================================================
   KEY LƯU TRÊN TRÌNH DUYỆT
   ===================================================== */

const DEVICE_KEY =
"DU_DUONG_DEVICE_ID";

const NUMBER_KEY =
"DU_DUONG_MY_NUMBER";


/* =====================================================
   ELEMENT
   ===================================================== */

const numberBox =
document.getElementById("number");

const button =
document.getElementById("button");

const status =
document.getElementById("status");


/* =====================================================
   TRẠNG THÁI
   ===================================================== */

let dangQuay = false;


/* =====================================================
   TẠO ID THIẾT BỊ
   ===================================================== */

function getDeviceId() {

  let deviceId =
    localStorage.getItem(
      DEVICE_KEY
    );


  if (!deviceId) {

    deviceId =
      "DD-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 12);


    localStorage.setItem(
      DEVICE_KEY,
      deviceId
    );

  }


  return deviceId;

}


/* =====================================================
   GỌI API
   ===================================================== */

async function laySo() {

  const deviceId =
    getDeviceId();


  const url =
    API_URL +
    "?clientId=" +
    encodeURIComponent(deviceId) +
    "&t=" +
    Date.now();


  const response =
    await fetch(
      url,
      {
        method: "GET",
        cache: "no-store"
      }
    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  const data =
    await response.json();


  if (!data.success) {

    throw new Error(
      data.message ||
      "API không trả số"
    );

  }


  if (
    data.so === undefined ||
    data.so === null
  ) {

    throw new Error(
      "API không có trường so"
    );

  }


  return data;

}


/* =====================================================
   QUAY SỐ
   ===================================================== */

async function quaySo() {


  if (dangQuay) {

    return;

  }


  /*
   * Kiểm tra localStorage trước
   */

  const savedNumber =
    localStorage.getItem(
      NUMBER_KEY
    );


  if (savedNumber) {

    hienThiSo(
      Number(savedNumber),
      true
    );

    return;

  }


  dangQuay = true;


  button.disabled = true;


  status.classList.remove(
    "error"
  );


  status.innerText =
    "Đang quay số...";


  numberBox.classList.add(
    "rolling"
  );


  /*
   * GỌI API NGAY
   */

  const apiRequest =
    laySo();


  /*
   * HIỆU ỨNG SỐ CHẠY
   *
   * Các số này chỉ là hiệu ứng.
   * Số cuối cùng lấy từ API.
   */

  let running = true;


  function animation() {

    if (!running) {

      return;

    }


    numberBox.innerText =
      Math.floor(
        Math.random() * 100
      ) + 1;


    requestAnimationFrame(
      animation
    );

  }


  requestAnimationFrame(
    animation
  );


  try {


    /*
     * Chờ server
     */

    const data =
      await apiRequest;


    /*
     * Giữ hiệu ứng để nhìn mượt
     */

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          1200
        )
    );


    /*
     * Dừng animation
     */

    running = false;


    numberBox.classList.remove(
      "rolling"
    );


    /*
     * LẤY SỐ THẬT TỪ API
     */

    const so =
      Number(data.so);


    /*
     * LƯU SỐ TRÊN MÁY
     */

    localStorage.setItem(
      NUMBER_KEY,
      String(so)
    );


    /*
     * HIỂN THỊ
     */

    hienThiSo(
      so,
      false
    );


  } catch (error) {


    running = false;


    numberBox.classList.remove(
      "rolling"
    );


    numberBox.innerText =
      "?";


    status.classList.add(
      "error"
    );


    status.innerText =
      "Không thể kết nối với hệ thống";


    button.disabled = false;


    dangQuay = false;


    console.error(
      "DU DUONG API ERROR:",
      error
    );

  }

}


/* =====================================================
   HIỂN THỊ SỐ
   ===================================================== */

function hienThiSo(
  so,
  daReload
) {


  numberBox.innerText =
    so;


  numberBox.classList.remove(
    "rolling"
  );


  /*
   * Chạy hiệu ứng thắng khi vừa quay
   */

  if (!daReload) {

    numberBox.classList.remove(
      "winner"
    );


    void numberBox.offsetWidth;


    numberBox.classList.add(
      "winner"
    );

  }


  if (daReload) {

    status.innerText =
      "Bạn đã quay số này rồi";

  } else {

    status.innerText =
      "🎉 Số may mắn của bạn là " +
      so;

  }


  button.innerText =
    "ĐÃ QUAY";


  button.disabled =
    true;


  dangQuay =
    false;


  taoBarcode(
    so
  );

}


/* =====================================================
   TẠO BARCODE
   ===================================================== */

function taoBarcode(so) {


  if (
    typeof JsBarcode !==
    "function"
  ) {

    return;

  }


  JsBarcode(
    "#barcode",
    String(so),
    {

      format: "CODE128",

      width: 3,

      height: 70,

      displayValue: true,

      fontSize: 18,

      margin: 5

    }
  );

}


/* =====================================================
   KIỂM TRA KHI RELOAD
   ===================================================== */

function khoiDong() {


  const savedNumber =
    localStorage.getItem(
      NUMBER_KEY
    );


  /*
   * Nếu máy này đã quay:
   * hiện lại số cũ.
   *
   * KHÔNG gọi API.
   */

  if (savedNumber) {

    hienThiSo(
      Number(savedNumber),
      true
    );

  }

}


/* =====================================================
   KHỞI ĐỘNG
   ===================================================== */

khoiDong();


</script>


</body>

</html>
