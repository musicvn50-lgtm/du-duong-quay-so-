<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DU DƯƠNG - Quay số</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  background: #f6efdc;

  font-family: Arial, sans-serif;
}

.card {
  width: 92%;
  max-width: 500px;

  padding: 45px 30px;

  background: #fffdf8;

  border-radius: 28px;

  text-align: center;

  box-shadow:
    0 15px 45px rgba(60,40,20,.15);
}

.title {
  font-size: 42px;
  font-weight: 900;

  color: #2e241d;

  margin-bottom: 8px;
}

.subtitle {
  font-size: 17px;
  font-weight: bold;

  color: #98583d;
}

.number {
  height: 130px;

  margin: 45px 0 30px;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 100px;
  font-weight: 900;

  color: #4b2d20;
}

.rolling {
  animation: rolling .08s infinite alternate;
}

@keyframes rolling {

  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.08);
  }

}

button {
  border: none;

  padding: 17px 45px;

  border-radius: 50px;

  background: #837c75;

  color: white;

  font-size: 20px;
  font-weight: bold;

  cursor: pointer;
}

button:hover {
  transform: scale(1.03);
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.status {
  min-height: 25px;

  margin-top: 20px;

  color: #8b6b57;

  font-size: 15px;
}

.barcode {
  margin-top: 25px;

  min-height: 90px;

  display: flex;
  justify-content: center;
  align-items: center;
}

.note {
  margin-top: 20px;

  color: #aaa;

  font-size: 12px;
}

</style>
</head>


<body>


<div class="card">

  <div class="title">
    DU DƯƠNG
  </div>

  <div class="subtitle">
    SỐ MAY MẮN 1 – 100
  </div>


  <div
    id="number"
    class="number">

    ?

  </div>


  <button
    id="button"
    onclick="quaySo()">

    QUAY SỐ

  </button>


  <div
    id="status"
    class="status">

    Bạn chưa quay số

  </div>


  <div class="barcode">

    <svg id="barcode"></svg>

  </div>


  <div class="note">

    Mỗi thiết bị chỉ được quay một lần

  </div>

</div>


<script>


// ==================================================
// GOOGLE APPS SCRIPT API
// ==================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbxWCGFd2DfCP8BiP8cowMs0bEN6TH-FCBrrT-f7MRTf6GdATDb4qIrw5LZ5UoGiHkBC/exec";


// ==================================================
// LOCAL STORAGE
// ==================================================

const STORAGE_KEY =
"DU_DUONG_SO_MAY_NAY";

const DEVICE_KEY =
"DU_DUONG_DEVICE_ID";


// ==================================================
// TẠO MÃ THIẾT BỊ
// ==================================================

function getDeviceId() {

  let id =
    localStorage.getItem(DEVICE_KEY);


  if (!id) {

    id =
      "DD-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 12);


    localStorage.setItem(
      DEVICE_KEY,
      id
    );

  }


  return id;

}


// ==================================================
// HIỂN THỊ SỐ
// ==================================================

function hienThiSo(number, daQuay) {

  const numberBox =
    document.getElementById("number");

  const button =
    document.getElementById("button");

  const status =
    document.getElementById("status");


  const ma =
    String(number).padStart(3, "0");


  numberBox.innerText =
    ma;


  taoBarcode(ma);


  if (daQuay) {

    status.innerText =
      "Bạn đã quay số này rồi";

    button.innerText =
      "ĐÃ QUAY";

    button.disabled =
      true;

  } else {

    status.innerText =
      "🎉 Số may mắn của bạn là " + ma;

    button.innerText =
      "ĐÃ QUAY";

    button.disabled =
      true;

  }

}


// ==================================================
// BARCODE
// ==================================================

function taoBarcode(ma) {

  if (
    typeof JsBarcode ===
    "undefined"
  ) {

    return;

  }


  JsBarcode(
    "#barcode",
    ma,
    {
      format: "CODE128",
      width: 3,
      height: 70,
      displayValue: true,
      fontSize: 18,
      margin: 5
    }
  );

}


// ==================================================
// GỌI GOOGLE APPS SCRIPT
// JSONP
// ==================================================

function goiGoogle(callback) {

  const deviceId =
    encodeURIComponent(
      getDeviceId()
    );


  const callbackName =
    "duDuong_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement("script");


  let finished = false;


  const timeout =
    setTimeout(function() {

      if (finished) {
        return;
      }

      finished = true;

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch(e) {}

      callback({
        success: false,
        message:
          "Không thể kết nối với hệ thống"
      });

    }, 15000);


  window[callbackName] =
    function(data) {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }


      try {
        delete window[callbackName];
      } catch(e) {}


      callback(data);

    };


  script.onerror =
    function() {

      if (finished) {
        return;
      }

      finished = true;

      clearTimeout(timeout);


      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }


      try {
        delete window[callbackName];
      } catch(e) {}


      callback({
        success: false,
        message:
          "Không thể kết nối với hệ thống"
      });

    };


  script.src =
    API_URL +
    "?clientId=" +
    deviceId +
    "&callback=" +
    callbackName +
    "&t=" +
    Date.now();


  document.body.appendChild(
    script
  );

}


// ==================================================
// QUAY SỐ
// ==================================================

function quaySo() {

  const button =
    document.getElementById("button");

  const numberBox =
    document.getElementById("number");

  const status =
    document.getElementById("status");


  // Kiểm tra mã đã lưu trên thiết bị
  const oldNumber =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (oldNumber) {

    hienThiSo(
      Number(oldNumber),
      true
    );

    return;

  }


  button.disabled =
    true;


  numberBox.classList.add(
    "rolling"
  );


  status.innerText =
    "Đang quay số...";


  let count = 0;


  const animation =
    setInterval(function() {


      const random =
        Math.floor(
          Math.random() * 100
        ) + 1;


      numberBox.innerText =
        String(random).padStart(
          3,
          "0"
        );


      count++;


      if (count >= 30) {

        clearInterval(
          animation
        );


        numberBox.classList.remove(
          "rolling"
        );


        status.innerText =
          "Đang lấy số may mắn...";


        // ==========================================
        // LẤY MÃ THẬT TỪ GOOGLE SHEET
        // ==========================================

        goiGoogle(function(data) {


          if (
            !data ||
            !data.success
          ) {

            button.disabled =
              false;


            status.innerText =
              "❌ " +
              (
                data &&
                data.message
                  ? data.message
                  : "Không thể kết nối với hệ thống"
              );


            return;

          }


          const ma =
            String(data.ma)
              .padStart(3, "0");


          // Lưu mã trên thiết bị
          localStorage.setItem(
            STORAGE_KEY,
            ma
          );


          // Hiển thị
          hienThiSo(
            ma,
            false
          );


        });


      }


    }, 70);

}


// ==================================================
// KHI MỞ TRANG
// ==================================================

(function() {

  const oldNumber =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (oldNumber) {

    hienThiSo(
      oldNumber,
      true
    );

  }

})();

</script>

</body>
</html>
